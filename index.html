<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Student Attendance System
    </title>

    <meta
        name="theme-color"
        content="#222222"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="container">

    <h1>
        Student Attendance System
    </h1>


    <div
        id="syncStatus"
        class="sync-status"
    >
        Loading...
    </div>


    <!-- ATTENDANCE -->

    <section class="section">

        <h2>
            Attendance Registration
        </h2>

        <p class="subtitle">
            Enter Student Code
        </p>


        <input
            type="text"
            inputmode="numeric"
            maxlength="4"
            id="studentCode"
            placeholder="Example: 3101"
            autocomplete="off"
            autofocus
        >


        <button id="attendanceButton">
            Register Attendance
        </button>


        <div id="message"></div>


        <div class="today-total">

            Today's Attendance:

            <strong id="attendanceCount">
                0
            </strong>

        </div>

    </section>



    <!-- GRADES -->

    <section class="section">

        <h2>
            Attendance by Grade
        </h2>


        <div class="grade-buttons">

            <button
                class="grade-button active"
                data-grade="Grade 3"
            >
                Grade 3
            </button>


            <button
                class="grade-button"
                data-grade="Grade 4"
            >
                Grade 4
            </button>


            <button
                class="grade-button"
                data-grade="Grade 5"
            >
                Grade 5
            </button>


            <button
                class="grade-button"
                data-grade="Grade 6"
            >
                Grade 6
            </button>

        </div>


        <div class="grade-summary">

            <div class="summary-card">

                <span>
                    Total Students
                </span>

                <strong id="totalStudents">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    Present
                </span>

                <strong id="presentStudents">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    Absent
                </span>

                <strong id="absentStudents">
                    0
                </strong>

            </div>

        </div>


        <h2 id="gradeTitle">
            Grade 3 Attendance
        </h2>


        <div id="gradeAttendanceList">
        </div>

    </section>

</div>


<script src="app.js"></script>

</body>

</html>
