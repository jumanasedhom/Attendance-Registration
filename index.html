<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Attendance System
    </title>

    <meta
        name="theme-color"
        content="#222222"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="container">

    <h1>
       Attendance System
    </h1>


    <div
        id="syncStatus"
        class="sync-status"
    >
        Loading...
    </div>


    <!-- ATTENDANCE -->

    <section class="section">

        <h2>
            Attendance Registration
        </h2>

        <p class="subtitle">
            Enter The Code
        </p>


        <input
            type="text"
            inputmode="numeric"
            maxlength="4"
            id="studentCode"
            autocomplete="off"
            autofocus
        >


        <button id="attendanceButton">
            Register Attendance
        </button>

        <button
           id="removeAttendanceButton"
           class="remove-button"
        >
            Remove Attendance
        </button>

        <div id="message"></div>


        <div class="today-attendance-by-grade">

    <div class="today-grade-row">
        <span>Today's Attendance - Grade 3</span>
        <strong id="todayGrade3Count">0</strong>
    </div>

    <div class="today-grade-row">
        <span>Today's Attendance - Grade 4</span>
        <strong id="todayGrade4Count">0</strong>
    </div>

    <div class="today-grade-row">
        <span>Today's Attendance - Grade 5</span>
        <strong id="todayGrade5Count">0</strong>
    </div>

    <div class="today-grade-row">
        <span>Today's Attendance - Grade 6</span>
        <strong id="todayGrade6Count">0</strong>
    </div>

</div>
    </section>



    <!-- GRADES -->

    <section class="section">

        <h2>
            Attendance by Grade
        </h2>


        <div class="grade-buttons">

            <button
                class="grade-button active"
                data-grade="Grade 3"
            >
                Grade 3
            </button>


            <button
                class="grade-button"
                data-grade="Grade 4"
            >
                Grade 4
            </button>


            <button
                class="grade-button"
                data-grade="Grade 5"
            >
                Grade 5
            </button>


            <button
                class="grade-button"
                data-grade="Grade 6"
            >
                Grade 6
            </button>

        </div>


        <div class="grade-summary">

            <div class="summary-card">

                <span>
                    Total Students
                </span>

                <strong id="totalStudents">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    Present
                </span>

                <strong id="presentStudents">
                    0
                </strong>

            </div>


            <div class="summary-card">

                <span>
                    Absent
                </span>

                <strong id="absentStudents">
                    0
                </strong>

            </div>

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>

</html>
